[project]
name = "langgraph-test"
version = "0.2.0"
description = "AI-powered GitHub PR Review Bot using LangGraph with multi-agent architecture"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=44.0",
    "fastapi>=0.115",
    "langchain-azure-ai>=1.2.1",
    "langchain-litellm>=0.6.3",
    "langchain-openai>=0.3.0",
    "langchain-openrouter>=0.2.1",
    "langgraph>=0.3.0",
    "pydantic>=2.0",
    "pyjwt[crypto]>=2.9",
    "pydantic-settings>=2.0",
    "pygithub>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tenacity>=8.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[project.scripts]
pr-review = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config", "src/prompts", "src/state", "src/providers", "src/agents", "src/nodes", "src/graph", "src/services"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
